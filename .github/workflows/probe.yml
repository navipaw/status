name: Probe and publish

# Every 15 minutes, per probe-contract.json policy.checkIntervalMinutes.
# GitHub's cron is best-effort and can run late under load — that is exactly why
# the page derives staleness from lastCheckedAt rather than assuming the cron
# fired. A late run shows as Unknown, not as a false green.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # manual re-check, e.g. to confirm a recovery
  # Every push to main, with no path filter. The filter that was here omitted
  # scripts/ — the publishing logic itself — so changes to how the page is built
  # landed without ever deploying, silently. A wasted run costs nothing on a
  # public repository; a change that quietly fails to ship costs trust in the
  # page.
  push:
    branches: [main]

# Never let two runs interleave: both would read the same history, and the
# second commit would silently discard the first run's measurements.
concurrency:
  group: probe-and-publish
  cancel-in-progress: false

permissions:
  contents: write   # commit the updated history
  pages: write      # publish
  id-token: write   # required by deploy-pages

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      # Services reading Down with no incident explaining them. Raised by the
      # `alert` job below, after the page has published.
      unexplained_down: ${{ steps.build.outputs.unexplained_down }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Measurements live on an orphan `data` branch. At 2,880 commits a month
      # they would otherwise bury main's real history and grow every clone
      # forever; on their own branch they can be squashed or reset without
      # touching a line of site source.
      - name: Restore recorded history
        run: bash scripts/data-branch.sh restore

      # Every probe URL is committed; only the key is supplied. That split used
      # to run the other way, and the URL went with it — but a URL is what this
      # page measures, not a thing it holds, and hiding it meant no diff in any
      # repository could show what was actually being asked for. The key is a
      # real credential and stays one.
      - name: Check every probe URL is committed
        run: node scripts/check-contract-urls.mjs

      - name: Probe services
        env:
          PROBE_DATABASE_KEY: ${{ secrets.PROBE_DATABASE_KEY }}
        run: node scripts/probe.mjs

      - name: Save recorded history
        run: bash scripts/data-branch.sh save

      - name: Check incident text is publishable
        run: node scripts/check-sanitisation.mjs

      # status.json is a build output, never committed: generating it here means
      # the published page and its inputs cannot drift apart.
      - name: Build published snapshot
        id: build
        run: node scripts/build-data.mjs

      - uses: actions/configure-pages@v5

      # Everything the page needs, and nothing else. incidents/ and scripts/ are
      # deliberately excluded: the markdown sources and the prober have no
      # business being served from the status domain.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html preview.html CNAME _site/
          cp -r assets data fixtures _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fails the run when a service is Down and no incident explains it.
  #
  # Deliberately a separate job, and deliberately after `deploy`. The probe job
  # must finish green even during an outage, because the page it publishes is
  # what a reader needs most at exactly that moment — failing earlier would take
  # the status page down alongside the service it reports on. So the page ships
  # first and the run goes red afterwards.
  #
  # Why red at all: an `::error::` annotation leaves the run's conclusion green,
  # and a green run is one nobody opens. The database probe failed for nine days
  # under 275 consecutive green runs (#2176). A red run in the Actions list is
  # the signal that was missing.
  alert:
    needs: [probe, deploy]
    if: needs.probe.outputs.unexplained_down != ''
    runs-on: ubuntu-latest
    steps:
      # Through env, not interpolated into the shell — the value crosses a job
      # boundary as data and has no business being parsed as script.
      - name: Raise unexplained outage
        env:
          DOWN: ${{ needs.probe.outputs.unexplained_down }}
        run: |
          echo "::error::Down with no open incident: $DOWN"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Down with no open incident: \`$DOWN\`

          The page published normally — this job fails afterwards so the run is
          visible. Either post an incident with the **Post incident update**
          workflow, or fix the probe.
          EOF
          exit 1
